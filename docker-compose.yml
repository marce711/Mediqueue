networks:
  mediqueue-net:
    driver: overlay
    attachable: true

volumes:
  postgres1_data:
  postgres2_data:
  postgres3_data:
  backrest_repo:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:

  api-gateway:
    build: ./services/apigateway
    ports:
      - "8080:8080"
    depends_on:
      paciente-service:
        condition: service_healthy
      cita-service:
        condition: service_healthy
      doctor-horario:
        condition: service_healthy
      pago-service:
        condition: service_healthy
      notificacion-service:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  etcd:
    image: public.ecr.aws/bitnami/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres1:
    build: ./infrastructure/ha-postgres/patroni
    environment:
      - NODE_NAME=postgres1
      - NODE_IP=postgres1
      - POSTGRES_PASSWORD=mediqueue123
      - REPLICATION_PASSWORD=replicator123
      - PATRONI_ETCD_HOSTS=etcd:2379
      - PATRONI_SCOPE=mediqueue-cluster
    volumes:
      - ./infrastructure/ha-postgres/patroni/patroni.yml.template:/home/postgres/patroni.yml.template:ro
      - ./infrastructure/ha-postgres/patroni/entrypoint.sh:/home/postgres/entrypoint.sh:ro
      - ./infrastructure/ha-postgres/backrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres1_data:/var/lib/postgresql/data
      - backrest_repo:/var/lib/pgbackrest
    entrypoint: ["/bin/bash", "/home/postgres/entrypoint.sh"]
    networks:
      - mediqueue-net
    depends_on:
      etcd:
        condition: service_healthy

  postgres2:
    build: ./infrastructure/ha-postgres/patroni
    environment:
      - NODE_NAME=postgres2
      - NODE_IP=postgres2
      - POSTGRES_PASSWORD=mediqueue123
      - REPLICATION_PASSWORD=replicator123
      - PATRONI_ETCD_HOSTS=etcd:2379
      - PATRONI_SCOPE=mediqueue-cluster
    volumes:
      - ./infrastructure/ha-postgres/patroni/patroni.yml.template:/home/postgres/patroni.yml.template:ro
      - ./infrastructure/ha-postgres/patroni/entrypoint.sh:/home/postgres/entrypoint.sh:ro
      - ./infrastructure/ha-postgres/backrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - postgres2_data:/var/lib/postgresql/data
      - backrest_repo:/var/lib/pgbackrest
    entrypoint: ["/bin/bash", "/home/postgres/entrypoint.sh"]
    networks:
      - mediqueue-net
    depends_on:
      etcd:
        condition: service_healthy

  postgres3:
    build: ./infrastructure/ha-postgres/patroni
    environment:
      - NODE_NAME=postgres3
      - NODE_IP=postgres3
      - POSTGRES_PASSWORD=mediqueue123
      - REPLICATION_PASSWORD=replicator123
      - PATRONI_ETCD_HOSTS=etcd:2379
      - PATRONI_SCOPE=mediqueue-cluster
    volumes:
      - ./infrastructure/ha-postgres/patroni/patroni.yml.template:/home/postgres/patroni.yml.template:ro
      - ./infrastructure/ha-postgres/patroni/entrypoint.sh:/home/postgres/entrypoint.sh:ro
      - ./infrastructure/ha-postgres/backrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - postgres3_data:/var/lib/postgresql/data
      - backrest_repo:/var/lib/pgbackrest
    entrypoint: ["/bin/bash", "/home/postgres/entrypoint.sh"]
    networks:
      - mediqueue-net
    depends_on:
      etcd:
        condition: service_healthy

  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./infrastructure/ha-postgres/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5433:5432"
      - "7000:7000" # Stats
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres1
      - postgres2
      - postgres3

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mediqueue.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - mediqueue-net
    depends_on:
      - haproxy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mediqueue
      RABBITMQ_DEFAULT_PASS: mediqueue123
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  paciente-service:
    build: ./services/paciente_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://haproxy:5432/mediqueueadmin
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://haproxy:5433/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8083:8083"

  doctor-horario:
    build: ./services/doctor_horario
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://haproxy:5432/mediqueueadmin
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://haproxy:5433/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8082:8082"

  cita-service:
    build: ./services/cita_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://haproxy:5432/mediqueueadmin
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://haproxy:5433/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
      PATIENT_SERVICE_URL: http://paciente-service:8083
      DOCTOR_SERVICE_URL: http://doctor-horario:8082
    depends_on:
      haproxy:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8081:8081"

  pago-service:
    build: ./services/pago_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://haproxy:5432/mediqueueadmin
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://haproxy:5433/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
      SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
      SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
    depends_on:
      haproxy:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8084:8084"

  notificacion-service:
    build: ./services/notificacion_service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
      SPRING_RABBITMQ_LISTENER_SIMPLE_DEFAULT_REQUEUE_REJECTED: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8085:8085"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - mediqueue-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mediqueue-net
    restart: unless-stopped
    depends_on:
      - prometheus

  frontend:
    build: ./services/frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - mediqueue-net
    depends_on:
      - api-gateway
