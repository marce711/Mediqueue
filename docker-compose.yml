networks:
  mediqueue-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mediqueueadmin
      POSTGRES_USER: mediqueue
      POSTGRES_PASSWORD: mediqueue123
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediqueue -d mediqueueadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-sentinel:
    image: bitnami/redis-sentinel:latest
    environment:
      - REDIS_MASTER_HOST=redis
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=mymaster
    networks:
      - mediqueue-net
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mediqueue
      RABBITMQ_DEFAULT_PASS: mediqueue123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  paciente-service:
    build: ./services/paciente_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 20s
      retries: 5

  doctor-horario:
    build: ./services/doctor_horario
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 20s
      retries: 5

  cita-service:
    build: ./services/cita_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel:26379
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 20s
      retries: 5

  pago-service:
    build: ./services/pago_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediqueueadmin
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
      APP_APPOINTMENT_SERVICE_URL: http://cita-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 20s
      retries: 5

  notificacion-service:
    build: ./services/notificacion_service
    environment:
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 20s
      retries: 5

  api-gateway:
    build: ./services/apigateway
    environment:
      SPRING_RABBITMQ_ADDRESSES: rabbitmq:5672
      PACIENTE_SERVICE_URL: http://paciente-service:8083
      CITA_SERVICE_URL: http://cita-service:8081
      DOCTOR_SERVICE_URL: http://doctor-horario:8082
      PAGO_SERVICE_URL: http://pago-service:8084
      NOTIFICACION_SERVICE_URL: http://notificacion-service:8085
    ports:
      - "8080:8080"
    depends_on:
      paciente-service:
        condition: service_healthy
      cita-service:
        condition: service_healthy
      doctor-horario:
        condition: service_healthy
      pago-service:
        condition: service_healthy
      notificacion-service:
        condition: service_healthy
    networks:
      - mediqueue-net

  frontend:
    build: ./services/frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - mediqueue-net
    depends_on:
      - api-gateway
