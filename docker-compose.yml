
networks:
  mediqueue-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:

  api_gateway:
    build: ./services/apigateway
    ports:
      - "8080:8080"
    depends_on:
      - paciente_service
      - cita_service
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mediqueue
      POSTGRES_PASSWORD: mediqueue123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mediqueue" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mediqueue
      RABBITMQ_DEFAULT_PASS: mediqueue123
    ports:
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mediqueue-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  paciente_service:
    build: ./services/paciente_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pacienteDB
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  doctor_horario:
    build: ./services/doctor_horario
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/doctorDB
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  cita_service:
    build: ./services/cita_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/citaDB
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
      PATIENT_SERVICE_URL: http://paciente_service:8081
      DOCTOR_SERVICE_URL: http://doctor_horario:8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  pago_service:
    build: ./services/pago_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pagoDB
      SPRING_DATASOURCE_USERNAME: mediqueue
      SPRING_DATASOURCE_PASSWORD: mediqueue123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  notificacion_service:
    build: ./services/notificacion_Service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mediqueue
      SPRING_RABBITMQ_PASSWORD: mediqueue123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mediqueue-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - mediqueue-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mediqueue-net
    restart: unless-stopped
    depends_on:
      - prometheus
