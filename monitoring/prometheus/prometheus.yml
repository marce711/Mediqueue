global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
          node: node1

  - job_name: api_gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['100.76.170.62:8080']
        labels:
          service: api-gateway
          node: node1
      - targets: ['100.115.210.113:8080']
        labels:
          service: api-gateway
          node: node2
      - targets: ['100.99.158.111:8080']
