spring.application.name=doctor-horario
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5000/mediqueueadmin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mediqueue}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mediqueue123}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:100.76.170.62,100.115.210.113,100.99.158.11}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:mediqueue}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:mediqueue123}

# Resilience4j
resilience4j.circuitbreaker.instances.mainDB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mainDB.sliding-window-size=10
resilience4j.retry.instances.dbRetry.max-attempts=3
resilience4j.retry.instances.dbRetry.wait-duration=1s

app.rabbitmq.rpc-exchange=mediqueue.rpc.exchange
app.rabbitmq.doctor-validation-queue=mediqueue.doctor.validation
app.rabbitmq.doctor-validation-routing-key=doctor.validate

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.probes.enabled=true

logging.level.root=INFO
logging.level.com.mediqueue.doctorhorario=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
