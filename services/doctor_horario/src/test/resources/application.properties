spring.datasource.url=jdbc:h2:mem:doctor_horario_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

app.rabbitmq.rpc-exchange=mediqueue.rpc.exchange
app.rabbitmq.doctor-validation-queue=mediqueue.doctor.validation
app.rabbitmq.doctor-validation-routing-key=doctor.validate
