spring.datasource.url=jdbc:h2:mem:payment_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
app.services.appointment-url=http://localhost:8081
app.rabbitmq.payments-exchange=mediqueue.payments.exchange
app.rabbitmq.payment-success-queue=mediqueue.payments.success
app.rabbitmq.payment-failed-queue=mediqueue.payments.failed
app.rabbitmq.payment-success-routing-key=payments.success
app.rabbitmq.payment-failed-routing-key=payments.failed
